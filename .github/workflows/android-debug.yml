name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Enable development premium
        run: printf 'sdk.dir=%s\nDEBUG_PREMIUM=true\n' "$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Hub-Dev-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
